spring:
  application:
    name: sales-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false

management:
  endpoint:
    health:
      probes:
        enabled: true

application:
  security:
    jwt:
      public-key: ""
      private-key: ""

services:
  users:
    url: http://localhost:8089
  store:
    url: http://localhost:8089
  loyalty:
    url: http://localhost:8089
  bank-gateway:
    url: http://localhost:8089
