server:
  port: ${PORT:8080}

spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sales_db}
    username: ${DB_USER:devuser}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration${FLYWAY_ADDITIONAL_LOCATIONS:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
    from: ${MAIL_FROM:contact@shop-loc.fr}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    persistAuthorization: true

application:
  openapi:
    title: "ShopLoc - Sales Service API"
    description: "Sales and payment management REST API for the ShopLoc platform"
    version: "1.0.0"
    contact:
      name: "MIAGE Collectiv'IT Team"
      email: "contact@collectivit.miage.fr"
      url: "https://github.com/MIAGECollectivIT"
    license:
      name: "MIT"
      url: "https://opensource.org/licenses/MIT"
    extensions:
      x-api-audience: "ShopLoc Internal Microservices"
      x-service-environment: "${ENVIRONMENT:development}"
      x-service-name: "sales-service"
  security:
    auth-type: "Bearer JWT"
    jwt:
      public-key: "${JWT_PUBLIC_KEY:}"
      private-key: "${JWT_PRIVATE_KEY:}"
      secret-key: "${JWT_SECRET:}"
    description: "Authenticate using a JWT Bearer token. Enter your token prefixed with 'Bearer ' or simply the token value."
  kafka:
    topics:
      transaction-approved: ${KAFKA_TOPIC_TRANSACTION_APPROVED:shoploc.transactions.approved}

services:
  users:
    url: ${USERS_SERVICE_URL:http://users-service:8080}
  store:
    url: ${STORE_SERVICE_URL:http://store-service:8080}
  loyalty:
    url: ${LOYALTY_SERVICE_URL:http://loyalty-service:8080}
  bank-gateway:
    url: ${EXTERNAL_MOCK_SERVICE_URL:http://external-mock-service:8080}
